name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel-portability:
    name: kernel-portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap managed Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\bootstrap_toolchain.ps1

      - name: Build and test Kernel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .\tools\activate_toolchain.ps1
          cmake -S . -B kernel/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/ci --parallel 2
          ctest --test-dir kernel/out/ci --output-on-failure --parallel 2 -E aot_performance_gate

      - name: Build and test Kernel on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B kernel/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/ci --parallel 2
          ctest --test-dir kernel/out/ci --output-on-failure --parallel 2 -E aot_performance_gate

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap managed Windows toolchain
        shell: pwsh
        run: .\tools\bootstrap_toolchain.ps1

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Build kernel and run binding tests
        shell: pwsh
        run: |
          . .\tools\activate_toolchain.ps1
          $env:DAO_KERNEL_DLL_DIRS = Join-Path $PWD '.toolchain\llvm-mingw\bin'
          cmake -S . -B kernel/out/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/cmake --parallel 2
          python -m pytest -q tests/test_mcp_arithmetic.py tests/test_mcp_server_kernel.py tests/test_memory_kernel.py tests/test_task_kernel.py tests/test_agent_kernel.py
