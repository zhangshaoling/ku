name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  kernel-portability:
    name: kernel-portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap managed Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\bootstrap_toolchain.ps1

      - name: Build and test Kernel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .\tools\activate_toolchain.ps1
          cmake -S . -B kernel/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/ci --parallel 2
          ctest --test-dir kernel/out/ci --output-on-failure --parallel 2 -E aot_performance_gate

      - name: Build and test Kernel on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B kernel/out/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/ci --parallel 2
          ctest --test-dir kernel/out/ci --output-on-failure --parallel 2 -E aot_performance_gate

      - name: Package and verify installed SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .\tools\activate_toolchain.ps1
          cpack --config kernel/out/ci/CPackConfig.cmake -B kernel/out/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem kernel/out/packages/Ku-*.zip)
          if ($packages.Count -ne 1) { throw 'Expected one SDK package' }
          $package = $packages[0]
          python tools/verify_installed_sdk.py $package.FullName
          exit $LASTEXITCODE

      - name: Package and verify installed SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpack --config kernel/out/ci/CPackConfig.cmake -B kernel/out/packages
          python tools/verify_installed_sdk.py kernel/out/packages/Ku-*.zip

      - name: Upload SDK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.os }}
          path: |
            kernel/out/packages/Ku-*.zip
            kernel/out/packages/Ku-*.zip.sha256
          if-no-files-found: error

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap managed Windows toolchain
        shell: pwsh
        run: .\tools\bootstrap_toolchain.ps1

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Build kernel and run binding tests
        shell: pwsh
        run: |
          . .\tools\activate_toolchain.ps1
          $env:DAO_KERNEL_DLL_DIRS = Join-Path $PWD '.toolchain\llvm-mingw\bin'
          cmake -S . -B kernel/out/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kernel/out/cmake --parallel 2
          python -m pytest -q tests/test_mcp_arithmetic.py tests/test_mcp_server_kernel.py tests/test_memory_kernel.py tests/test_task_kernel.py tests/test_agent_kernel.py tests/test_memory_loop.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kernel-portability, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: release
      - name: Publish versioned SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          python - "$release_version" <<'PY'
          import pathlib, re, sys, tomllib
          version = sys.argv[1]
          cmake = pathlib.Path('CMakeLists.txt').read_text()
          assert re.search(r'project\(dao_kernel VERSION ' + re.escape(version) + r' ', cmake)
          assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'] == version
          packages = list(pathlib.Path('release').glob(f'Ku-{version}-*.zip'))
          assert len(packages) == 3, packages
          assert all(path.with_suffix('.zip.sha256').exists() for path in packages)
          PY
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Ku $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
